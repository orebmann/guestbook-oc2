apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guestbook-oc.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "guestbook-oc.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "guestbook-oc.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "guestbook-oc.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # OpenShift runs containers as a random non-root UID by default.
      # ubi8/httpd-24 is designed for this — no SCC changes needed.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: httpd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # ubi8/httpd-24 serves on 8080 out of the box.
          # We mount a custom index.html via ConfigMap.
          volumeMounts:
            - name: html
              mountPath: /var/www/html
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: {{ include "guestbook-oc.fullname" . }}-html
